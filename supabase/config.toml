project_id = "dance-crm"

[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
major_version = 15

[auth]
enabled = true
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false

[functions.github-send]
enabled = true
verify_jwt = false
import_map = "./functions/github-send/deno.json"
entrypoint = "./functions/github-send/index.ts"

[functions.telegram-auth]
enabled = true
verify_jwt = false
import_map = "./functions/telegram-auth/deno.json"
entrypoint = "./functions/telegram-auth/index.ts"

[functions.debug-log]
enabled = true
verify_jwt = false
entrypoint = "./functions/debug-log/index.ts"

[functions.env-debug]
enabled = true
verify_jwt = true
entrypoint = "./functions/env-debug/index.ts"

[functions.test-cors]
enabled = true
verify_jwt = true
entrypoint = "./functions/test-cors/index.ts"

[functions.text-diff]
enabled = true
verify_jwt = true
import_map = "./functions/text-diff/deno.json"
entrypoint = "./functions/text-diff/index.ts"

[functions.whoami]
enabled = true
verify_jwt = true
entrypoint = "./functions/whoami/index.ts"

[functions.event-weather]
enabled = true
verify_jwt = true
entrypoint = "./functions/event-weather/index.ts"

[functions.social-command-worker]
enabled = true
verify_jwt = false
entrypoint = "./functions/social-command-worker/index.ts"

[functions.social-publish-dispatch]
enabled = true
verify_jwt = false
entrypoint = "./functions/social-publish-dispatch/index.ts"
